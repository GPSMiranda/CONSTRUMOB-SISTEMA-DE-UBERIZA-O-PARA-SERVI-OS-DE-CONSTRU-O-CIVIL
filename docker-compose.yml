services:
  mysql:
    image: mysql:8.4
    container_name: construmob-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: construmob
      MYSQL_USER: construmob
      MYSQL_PASSWORD: construmob123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - construmob_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  construmob_mysql_data:
