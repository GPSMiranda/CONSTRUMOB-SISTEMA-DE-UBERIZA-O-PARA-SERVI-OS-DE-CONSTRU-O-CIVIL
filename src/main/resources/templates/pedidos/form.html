<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publicar demanda</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><h1>Publicar demanda</h1><div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div><form class="card card-body" th:action="@{/pedidos}" method="post"><label>Cliente</label><select name="clienteId" class="form-select mb-3" required><option th:each="c:${clientes}" th:value="${c.id}" th:text="${c.nome}"></option></select><label>Serviço</label><select name="servicoId" class="form-select mb-3" required><option th:each="s:${servicos}" th:value="${s.codigo}" th:text="${s.nome+' - R$ '+s.preco}"></option></select><label>Quantidade</label><input name="quantidade" type="number" min="1" value="1" class="form-control mb-3" required><label>Localidade</label><input name="localidade" class="form-control mb-3" required><label>Descrição</label><textarea name="descricao" class="form-control mb-3" rows="4" required></textarea><button class="btn btn-primary">Publicar</button></form></main></body></html>
