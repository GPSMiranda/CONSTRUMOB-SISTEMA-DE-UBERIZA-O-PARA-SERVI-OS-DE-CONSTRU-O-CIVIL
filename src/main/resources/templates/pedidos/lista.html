<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demandas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><div class="d-flex justify-content-between"><h1>Demandas</h1><a class="btn btn-primary" th:href="@{/pedidos/novo}">Publicar demanda</a></div><table class="table mt-3"><thead><tr><th>#</th><th>Cliente</th><th>Localidade</th><th>Status</th><th>Total</th><th></th></tr></thead><tbody><tr th:each="p:${pedidos}"><td th:text="${p.numero}"></td><td th:text="${p.cliente.nome}"></td><td th:text="${p.localidade}"></td><td th:text="${p.status}"></td><td th:text="${#numbers.formatDecimal(p.calcularTotal(),1,'POINT',2,'COMMA')}"></td><td><a th:href="@{'/pedidos/'+${p.numero}}">Detalhes</a></td></tr></tbody></table><a th:href="@{/}">Início</a></main></body></html>
