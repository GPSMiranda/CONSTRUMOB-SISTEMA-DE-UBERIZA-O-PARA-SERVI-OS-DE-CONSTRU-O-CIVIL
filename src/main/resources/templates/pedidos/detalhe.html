<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demanda</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><a th:href="@{/pedidos}">← Demandas</a><h1 th:text="${'Demanda #'+pedido.numero}"></h1><div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div><div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div><div class="card card-body mb-3"><p><strong>Cliente:</strong> <span th:text="${pedido.cliente.nome}"></span></p><p><strong>Localidade:</strong> <span th:text="${pedido.localidade}"></span></p><p><strong>Descrição:</strong> <span th:text="${pedido.descricao}"></span></p><p><strong>Status:</strong> <span th:text="${pedido.status}"></span></p></div><div th:if="${pedido.status.name()=='ABERTO'}" class="card card-body mb-3"><h2 class="h5">Aceitar demanda</h2><form th:action="@{'/pedidos/'+${pedido.numero}+'/aceitar'}" method="post"><select name="profissionalId" class="form-select mb-2" required><option th:each="p:${profissionais}" th:value="${p.id}" th:text="${p.nome}"></option></select><button class="btn btn-success">Aceitar</button></form></div><div th:if="${pedido.status.name()=='ACEITO'}" class="card card-body mb-3"><h2 class="h5">Finalizar serviço</h2><form th:action="@{'/pedidos/'+${pedido.numero}+'/finalizar'}" method="post"><button class="btn btn-primary">Finalizar</button></form></div><div class="d-flex gap-2"><form th:if="${pedido.status.name()!='FINALIZADO' && pedido.status.name()!='CANCELADO'}" th:action="@{'/pedidos/'+${pedido.numero}+'/cancelar'}" method="post"><button class="btn btn-outline-danger">Cancelar</button></form><a th:if="${pedido.status.name()=='FINALIZADO'}" class="btn btn-warning" th:href="@{'/avaliacoes/nova/'+${pedido.numero}}">Avaliar</a></div></main></body></html>
