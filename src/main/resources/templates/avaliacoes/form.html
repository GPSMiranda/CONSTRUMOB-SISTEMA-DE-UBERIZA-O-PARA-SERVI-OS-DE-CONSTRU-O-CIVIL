<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avaliar serviço</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><h1>Avaliar serviço</h1><form class="card card-body" th:action="@{/avaliacoes}" method="post"><input type="hidden" name="pedidoId" th:value="${pedido.numero}"><label>Nota (1 a 5)</label><input name="nota" type="number" min="1" max="5" class="form-control mb-3" required><label>Comentário</label><textarea name="comentario" class="form-control mb-3" rows="4"></textarea><button class="btn btn-primary">Registrar avaliação</button></form></main></body></html>
