<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo serviço</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><h1>Novo serviço</h1><form class="card card-body" th:action="@{/servicos}" th:object="${servico}" method="post"><input class="form-control mb-3" placeholder="Nome" th:field="*{nome}" required><input class="form-control mb-3" placeholder="Categoria" th:field="*{categoria}" required><input type="number" step="0.01" min="0" class="form-control mb-3" th:field="*{preco}" required><button class="btn btn-primary">Salvar</button></form></main></body></html>
