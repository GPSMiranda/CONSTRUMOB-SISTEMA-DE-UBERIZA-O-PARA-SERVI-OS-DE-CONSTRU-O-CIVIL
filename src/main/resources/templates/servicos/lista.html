<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serviços</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><div class="d-flex justify-content-between"><h1>Catálogo de serviços</h1><a class="btn btn-primary" th:href="@{/servicos/novo}">Novo serviço</a></div><table class="table mt-3"><thead><tr><th>Serviço</th><th>Categoria</th><th>Preço base</th></tr></thead><tbody><tr th:each="s:${servicos}"><td th:text="${s.nome}"></td><td th:text="${s.categoria}"></td><td th:text="${#numbers.formatDecimal(s.preco,1,'POINT',2,'COMMA')}"></td></tr></tbody></table><a th:href="@{/}">Início</a></main></body></html>
