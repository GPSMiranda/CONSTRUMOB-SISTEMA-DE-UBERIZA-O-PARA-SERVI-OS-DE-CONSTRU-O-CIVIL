<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONSTRUMOB</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav class="navbar navbar-expand-lg bg-dark navbar-dark"><div class="container"><a class="navbar-brand" th:href="@{/}">CONSTRUMOB</a><div class="navbar-nav"><a class="nav-link" th:href="@{/pedidos}">Demandas</a><a class="nav-link" th:href="@{/servicos}">Serviços</a><a class="nav-link" th:href="@{/clientes}">Clientes</a><a class="nav-link" th:href="@{/profissionais}">Profissionais</a></div></div></nav><main class="container py-4"><section class="hero mb-4"><h1>Serviços de construção civil com mais transparência</h1><p class="lead">MVP acadêmico para publicar demandas, conectar clientes e profissionais, controlar a execução e registrar avaliações.</p><a class="btn btn-primary" th:href="@{/pedidos/novo}">Publicar demanda</a></section><div class="card"><div class="card-body"><h2 class="h5">Demandas recentes</h2><div class="table-responsive"><table class="table"><thead><tr><th>#</th><th>Cliente</th><th>Localidade</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="p:${pedidos}"><td th:text="${p.numero}"></td><td th:text="${p.cliente.nome}"></td><td th:text="${p.localidade}"></td><td th:text="${p.status}"></td><td><a class="btn btn-sm btn-outline-secondary" th:href="@{'/pedidos/'+${p.numero}}">Ver</a></td></tr></tbody></table></div></div></div></main></body></html>
