<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profissionais</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><main class="container py-4"><div class="d-flex justify-content-between"><h1>Profissionais</h1><a class="btn btn-primary" th:href="@{/profissionais/novo}">Novo profissional</a></div><table class="table mt-3"><thead><tr><th>Nome</th><th>Especialidade</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="p:${profissionais}"><td th:text="${p.nome}"></td><td th:text="${p.especialidade}"></td><td th:text="${p.validado?'Validado':'Pendente'}"></td><td><form th:if="${!p.validado}" th:action="@{'/profissionais/'+${p.id}+'/validar'}" method="post"><button class="btn btn-sm btn-success">Validar cadastro</button></form></td></tr></tbody></table><a th:href="@{/}">Início</a></main></body></html>
